[tool.poetry]
name = "travel-agent"
version = "0.1.0"
description = "AI Travel Agent for Flight Booking"
authors = ["Mathius Johnson"]
readme = "README.md"
packages = [{include = "travel_agent", from = "src"}]

[tool.poetry.dependencies]
python = "^3.12"
fastapi = "^0.115.0"
uvicorn = "^0.32.0"
httpx = "^0.28.0"
pydantic = "^2.10.0"
python-dotenv = "^1.0.0"
requests = "^2.31.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.3.0"
pytest-asyncio = "^0.24.0"
black = "^24.0.0"
flake8 = "^7.0.0"
mypy = "^1.11.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"